name: winpath-canon-check
on:
  push:
    branches: [ci/winpath-canon-check]
  workflow_dispatch:
jobs:
  winpath:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - working-directory: ci-experiments/winpath
        run: cargo run --release
  pathescape:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - working-directory: ci-experiments/pathescape
        run: cargo run --release
