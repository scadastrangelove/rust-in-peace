[project]
name = "vuln-pipeline"
version = "0.3.0"
description = "Execution-verified, Rust-first vulnerability discovery and remediation pipeline"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai-agent = ["jsonschema>=4.23,<5"]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "jsonschema>=4.23,<5",
]

[project.scripts]
vuln-pipeline = "harness.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
"harness.ai_agent" = ["schemas/*.json"]
