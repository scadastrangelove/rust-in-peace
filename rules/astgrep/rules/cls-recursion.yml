                # container-as-counter: lopdf bounds `collect_resources` with
                # `already_seen.len() >= MAX_NESTING_DEPTH` + `.insert()`, and the
                # push/pop stack-depth idiom is equally common.
                - pattern: $X.insert($$$Y)
                - pattern: $X.push($$$Y)
      # G2  The bound is delegated to an RAII guard or a counting macro
      #     whose name states this exact mechanism: quick-xml's
      #     `de.enter_depth()?` handing back a `DepthGuard`, rmp-serde's
