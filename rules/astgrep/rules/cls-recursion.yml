      #     name (`budget.checked_sub(1)?`) -- tests and advances at once.
      - has:
          stopBy: end
          all:
            - kind: call_expression
            - regex: '(?i)(depth|recurs|nest|level|budget|fuel|remain|quota)[a-z_0-9\.]*\.(checked_sub|checked_add|saturating_sub|saturating_add)'
rule:
  kind: function_item
  all:
    - has: { field: name, pattern: $FN }
    - has:
        field: body
        has:
          stopBy: end
          all:
            - kind: identifier
            - pattern: $FN
            # `Slab::new()` inside `fn new()` and `Iter::next(self)` inside
            # `fn next()` are path segments that merely share the name --
            # the identifier must not be a qualifier's tail or a field.
            - not: { inside: { kind: scoped_identifier } }
            - not: { inside: { kind: field_expression } }
            # Laundering happens where the name is used as a VALUE: passed
            # as a fn-pointer argument, bound in a `let`, or handed to a
            # macro. A bare mention in a match arm is a shadowing local.
            - any:
                - inside: { kind: arguments }
                - inside: { kind: token_tree }
                # RHS only: `let name = self.x.name()?` shadows the fn
                # name in the PATTERN and is not a self-reference.
                - inside: { kind: let_declaration, field: value }
    # `fn fmt(&self, fmt: &mut Formatter)` -- a parameter shadowing the
    # function name is not a self-reference.
    - not:
        has:
          field: parameters
          has: { stopBy: end, pattern: $FN }
    # Nor is a LOCAL that shadows it: `fn name() { let name = ..; f(name) }`
    # and `match k { Kind::R(reason) => Some(reason) }` inside `fn reason()`
    # are the two commonest shapes here. Without name resolution a shadowed
    # binding is indistinguishable from a fn-pointer reference, so the
    # presence of any same-named binder disqualifies the function.
    - not:
        has:
          field: body
          has:
            stopBy: end
            any:
              - kind: let_declaration
                has:
                  field: pattern
                  any:
                    - pattern: $FN
                    - has: { stopBy: end, pattern: $FN }
              - kind: match_arm
                has:
                  field: pattern
                  any:
                    - pattern: $FN
                    - has: { stopBy: end, pattern: $FN }
              - kind: for_expression
                has:
                  field: pattern
                  any:
                    - pattern: $FN
                    - has: { stopBy: end, pattern: $FN }
              - kind: closure_parameters
                any:
                  - pattern: $FN
                  - has: { stopBy: end, pattern: $FN }
    - not:
        has:
          field: body
          has:
            stopBy: end
            kind: call_expression
            has:
              field: function
              any:
                # foo(...) -- bare identifier callee.
                - all:
                    - kind: identifier
                    - pattern: $FN
                # self.foo(...) -- the dominant Rust recursion idiom and the shape of
                # every lopdf finding. The receiver must be literally `self`;
                # `self.inner.foo()` is delegation to another type, not recursion.
