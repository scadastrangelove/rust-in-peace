          stopBy: end
          all:
            - kind: call_expression
            - regex: '(?i)(enter_depth|depth_?guard|recursion_?guard|recursion_?limit|depth_?limit|enter_recursion|guard_depth|bump_depth)'
      - has:
          stopBy: end
          all:
            - kind: macro_invocation
            - regex: '(?i)(depth|recurs)'
